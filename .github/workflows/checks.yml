name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Repository checks (frontmatter, links, public-repo safety, tokens)
        run: python scripts/check_repo.py
      - name: Build the site
        run: python site/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the plugin
        run: npx -y @anthropic-ai/claude-code plugin validate .
